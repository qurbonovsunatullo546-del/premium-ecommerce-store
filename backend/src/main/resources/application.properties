spring.application.name=maison-noir-store-api
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/maison_noir}
spring.datasource.username=${DATABASE_USERNAME:maison}
spring.datasource.password=${DATABASE_PASSWORD:maison}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=always
